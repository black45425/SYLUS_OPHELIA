<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Sylus & Ophelia</title>
        <style>
            /* 1. 페이지 전체 배경 및 기본 폰트 설정 */
            body {
                background-color: #f5f5f5;
                background-image: url("images/gray_bg.png");
                background-repeat: no-repeat;
                background-position: center top;
                background-size: 1080px auto;
                color: #222;
                margin: 0;
                padding: 0;
            }

            /* 2. 전체를 모아주는 메인 컨테이너 (1080px 너비) */
            .wrapper {
                width: 100%;
                max-width: 1080px;
                margin: 0 auto;
                padding: 0;
                box-sizing: border-box;
            }

            /* 본문 영역에만 좌우 20px 여백을 주는 클래스 */
            .content-inner {
                padding: 0 20px;
                box-sizing: border-box;
            }

            /* PNG 이미지 공통 설정 */
            .png-text {
                display: block;
                max-width: 100%;
                height: auto;
            }

            /* [1구역] 상단 HERO 배너 영역 (여백 없이 꽉 참) */
            .hero-banner {
                position: relative;
                width: 100%;
                margin-bottom: 80px;
                overflow: hidden;
            }
            .hero-bg {
                width: 100%;
                height: auto;
                display: block;
            }
            .hero-title-png {
                position: absolute;
                top: 60px;
                left: 60px;
                width: 320px;
                z-index: 2;
            }
            .hero-footer-png {
                position: absolute;
                bottom: 50px;
                left: 60px;
                width: 580px;
                z-index: 2;
            }

            /* [2구역] MAIN 프로필 영역 */
            .profile-section {
                display: flex;
                gap: 30px;
                align-items: flex-start;
                margin-bottom: 80px;
            }
            .profile-photo {
                width: 40%;
                border-radius: 120px 120px 0 0;
            }
            .profile-png-group {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 40px;
                margin-top: 230px;
                margin-bottom: 0px;
            }

            /* [3구역] 캐릭터 정보 영역 */
            .char-section {
                margin-bottom: 80px;
            }
            .char-grid {
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 20px;
                margin-top: 20px;
            }

            /* --- [갤러리 슬라이더 스타일] --- */
            .gallery-container {
                position: relative;
                display: flex;
                align-items: center;
                margin: 60px 0 80px 0;
            }

            .gallery-track-container {
                overflow: hidden;
                width: 100%;
            }

            .gallery-track {
                display: flex;
                gap: 15px;
                transition: transform 0.3s ease-in-out;
            }

            .gallery-item {
                flex: 0 0 calc(25% - 11.25px); /* 딱 4개씩 등분하여 배열 */
                cursor: pointer;
                overflow: hidden;
                border-radius: 4px;
            }

            .gallery-item img {
                width: 100%;
                height: 280px;
                object-fit: cover;
                display: block;
                transition: transform 0.2s ease;
            }

            .gallery-item:hover img {
                transform: scale(1.05);
            }

            /* 좌우 화살표 버튼 */
            .nav-btn {
                background: none;
                border: none;
                font-size: 28px;
                cursor: pointer;
                padding: 0 10px;
                color: #333;
                user-select: none;
                z-index: 2;
                transition: color 0.2s;
            }

            .nav-btn:hover {
                color: #888;
            }

            /* --- [확대 모달(라이트박스) 스타일] --- */
            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.85);
                z-index: 9999;
                justify-content: center;
                align-items: center;
            }

            .modal-content {
                max-width: 80%;
                max-height: 80vh;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
            }

            .modal-close {
                position: absolute;
                top: 30px;
                right: 40px;
                color: #fff;
                font-size: 40px;
                cursor: pointer;
                user-select: none;
            }

            .modal-btn {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: #fff;
                font-size: 50px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 20px;
                user-select: none;
            }

            .modal-prev { left: 20px; }
            .modal-next { right: 20px; }

            /* [4구역] 하단 CONTACT 영역 */
            .contact-section {
                text-align: center;
                border-top: 1px solid rgba(0, 0, 0, 0.1);
                padding-top: 40px;
                padding-bottom: 40px;
            }
            .contact-title-png {
                width: 200px;
                margin: 0 auto 20px auto;
            }
            .twitter-png {
                width: 100%;
                margin-bottom: 15px;
            }
            .copyright-png {
                width: 250px;
                margin: 30px auto 0 auto;
            }
        </style>
    </head>

    <body>
        <div class="wrapper">
            <!-- [1구역] 상단 배너 (양옆 여백 없이 1080px 꽉 채움) -->
            <header class="hero-banner">
                <img src="images/main_banner.png" alt="Hero Background" class="hero-bg" />
                <img src="images/title_sylus_ophelia.png" alt="Sylus & Ophelia" class="png-text hero-title-png" />
                <img src="images/love_and_deepspace_under.png" alt="Love & Deepspace" class="png-text hero-footer-png" />
            </header>

            <!-- 본문 영역 시작 (이 안의 요소들에만 좌우 20px 여백 적용) -->
            <div class="content-inner">
                
                <!-- [2구역] MAIN 프로필 -->
                <section class="profile-section">
                    <img src="images/profile.png" alt="Ryu E-Hwa" class="profile-photo" />

                    <div class="profile-png-group">
                        <img src="images/main.png" alt="Quote" class="png-text" style="width: 150px" />
                        <img src="images/abmim.png" alt="MAIN" class="png-text" style="width: 500px" />
                    </div>
                </section>

                <!-- [3구역] Ryu E-Hwa 캐릭터 상세 -->
                <section class="char-section">
                    <img src="images/name.png" alt="Ryu E-Hwa" class="png-text" style="width: 300px" />

                    <div class="char-grid">
                        <img src="images/info.png" alt="Info" class="png-text" />
                        <img src="images/point.png" alt="Appearance & Personality" class="png-text" />
                    </div>
                </section>

                <!-- [갤러리 섹션] -->
                <div class="gallery-container">
                    <button class="nav-btn prev-btn" onclick="moveSlide(-1)">&lt;</button>

                    <div class="gallery-track-container">
                        <div class="gallery-track" id="galleryTrack">
                            <div class="gallery-item" onclick="openModal(0)"><img src="images/drink.jpg" alt="이미지 1" /></div>
                            <div class="gallery-item" onclick="openModal(1)"><img src="images/blue_half_tone.jpg" alt="이미지 2" /></div>
                            <div class="gallery-item" onclick="openModal(2)"><img src="images/pantone.jpg" alt="이미지 3" /></div>
                            <div class="gallery-item" onclick="openModal(3)"><img src="images/playlist.jpg" alt="이미지 4" /></div>
                            <div class="gallery-item" onclick="openModal(4)"><img src="images/untitle.jpg" alt="이미지 5" /></div>
                            <div class="gallery-item" onclick="openModal(5)"><img src="images/edit.jpg" alt="이미지 6" /></div>
                        </div>
                    </div>

                    <button class="nav-btn next-btn" onclick="moveSlide(1)">&gt;</button>
                </div>

                <!-- [4구역] 하단 Contact -->
                <footer class="contact-section">
                    <img src="images/contact.png" alt="Contact" class="png-text contact-title-png" />

                    <a href="https://x.com" target="_blank">
                        <img src="images/twitter.png" alt="Twitter @ABMIM_GAME" class="png-text twitter-png" />
                    </a>

                    <img src="images/footer.png" alt="Copyright" class="png-text copyright-png" />
                </footer>

            </div>
            <!-- 본문 영역 끝 -->
        </div>

        <!-- 이미지 크게 보기 모달(팝업) -->
        <div class="modal" id="imageModal" onclick="closeModalOnBg(event)">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <button class="modal-btn modal-prev" onclick="changeModalImg(-1)">&lt;</button>
           <img class="modal-content" id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="확대 이미지" />
            <button class="modal-btn modal-next" onclick="changeModalImg(1)">&gt;</button>
        </div>

        <!-- 동작 자바스크립트 -->
        <script>
            let currentSlide = 0;
            let currentModalIndex = 0;

            const track = document.getElementById('galleryTrack');
            const items = document.querySelectorAll('.gallery-item');
            const totalItems = items.length;
            const itemsPerPage = 4; // 한 번에 보이는 개수

            // 이미지 경로 모음
            const imageSources = Array.from(items).map(item => item.querySelector('img').src);

            // 1. 슬라이더 화살표 이동 함수
            function moveSlide(direction) {
                const maxSlide = Math.max(0, totalItems - itemsPerPage);
                currentSlide += direction;

                if (currentSlide < 0) currentSlide = 0;
                if (currentSlide > maxSlide) currentSlide = maxSlide;

                // 25% + gap 간격만큼 이동
                const moveAmount = currentSlide * (100 / itemsPerPage + 1.4); 
                track.style.transform = `translateX(-${moveAmount}%)`;
            }

            // 2. 모달(크게 보기) 열기
            function openModal(index) {
                currentModalIndex = index;
                const modal = document.getElementById('imageModal');
                const modalImg = document.getElementById('modalImg');
                
                modalImg.src = imageSources[currentModalIndex];
                modal.style.display = 'flex';
            }

            // 3. 모달 닫기
            function closeModal() {
                document.getElementById('imageModal').style.display = 'none';
            }

            function closeModalOnBg(e) {
                if (e.target.id === 'imageModal') {
                    closeModal();
                }
            }

            // 4. 모달 내부에서 이전/다음 이미지 보기
            function changeModalImg(direction) {
                currentModalIndex += direction;
                if (currentModalIndex < 0) currentModalIndex = totalItems - 1;
                if (currentModalIndex >= totalItems) currentModalIndex = 0;

                document.getElementById('modalImg').src = imageSources[currentModalIndex];
            }

            // 키보드 Esc로 모달 닫기
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        </script>
    </body>
</html>
