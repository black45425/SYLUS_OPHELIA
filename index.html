<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sylus & Ophelia</title>
        <style>
            /* 1. 페이지 전체 배경 및 기본 폰트 설정 */
            body {
                background-color: #f5f5f5;
                background-image: url("images/gray_bg.png");
                background-repeat: no-repeat;
                background-position: center top;
                background-size: 1080px auto;
                color: #222;
                margin: 0;
                padding: 0;
            }

            /* 2. 전체를 모아주는 메인 컨테이너 (1080px 너비) */
            .wrapper {
                width: 100%;
                max-width: 1080px;
                margin: 0 auto;
                padding: 0;
                box-sizing: border-box;
            }

            /* 본문 영역에만 좌우 20px 여백을 주는 클래스 */
            .content-inner {
                padding: 0 20px;
                box-sizing: border-box;
            }

            /* PNG 이미지 공통 설정 */
            .png-text {
                display: block;
                max-width: 100%;
                height: auto;
            }

            /* [1구역] 상단 HERO 배너 영역 (여백 없이 꽉 참) */
            .hero-banner {
                position: relative;
                width: 100%;
                margin-bottom: 80px;
                overflow: hidden;
            }
            .hero-bg {
                width: 100%;
                height: auto;
                display: block;
            }
            
            /* 우측 반원 인물 그림 absolute 위치 고정 */
            .hero-arch-png {
                position: absolute;
                top: 0;
                right: 45px;
                height: 100%;
                width: auto;
                max-width: 65%;
                margin-top: 30px;
                object-fit: contain;
                object-position: right top;
                z-index: 1;
                opacity: 0;
                animation: slideFromRight 1.2s ease-out 0.2s forwards;
            }

            .hero-title-png {
                position: absolute;
                top: 8%;
                left: 5%;
                width: 35%;
                max-width: 360px;
                z-index: 2;
                animation: floatAnimation 4s ease-in-out infinite;
            }
            .hero-footer-png {
                position: absolute;
                bottom: 8%;
                left: 5%;
                width: 45%;
                max-width: 500px;
                z-index: 2;
            }

            /* [2구역] MAIN 프로필 영역 */
            .profile-section {
                display: flex;
                gap: 30px;
                align-items: flex-start;
                margin-bottom: 80px;
                opacity: 0;
                animation: fadeInUp 1.2s ease-out forwards;
            }
            .profile-photo {
                width: 40%;
                border-radius: 120px 120px 0 0;
                transition: transform 0.4s ease, box-shadow 0.4s ease, filter 0.4s ease;
            }
            .profile-photo:hover {
                transform: translateY(-5px) scale(1.02);
                box-shadow: 0 10px 25px rgba(180, 50, 50, 0.3);
            }
            .profile-png-group {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 40px;
                margin-top: 230px;
                margin-bottom: 0px;
            }

            /* [3구역] 캐릭터 정보 영역 - PC 3단 Grid 기본 설정 */
            .char-section {
                margin-bottom: 80px;
                opacity: 0;
                animation: fadeInUp 1.2s ease-out 0.3s forwards;
            }
            .char-grid-3col {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                margin-top: 20px;
            }
            .col-item {
                width: 100%;
            }
            .col-png {
                width: 100%;
                height: auto;
                display: block;
            }

            /* --- [갤러리 슬라이더 스타일] --- */
            .gallery-container {
                position: relative;
                display: flex;
                align-items: center;
                margin: 60px 0 80px 0;
                opacity: 0;
                animation: fadeInUp 1.2s ease-out 0.5s forwards;
            }

            .gallery-track-container {
                overflow: hidden;
                width: 100%;
            }

            .gallery-track {
                display: flex;
                gap: 15px;
                transition: transform 0.3s ease-in-out;
            }

            .gallery-item {
                flex: 0 0 calc(25% - 11.25px);
                cursor: pointer;
                overflow: hidden;
                border-radius: 4px;
            }

            .gallery-item img {
                width: 100%;
                height: 280px;
                object-fit: cover;
                display: block;
                transition: transform 0.2s ease;
            }

            .gallery-item:hover img {
                transform: scale(1.05);
            }

            .nav-btn {
                background: none;
                border: none;
                font-size: 28px;
                cursor: pointer;
                padding: 0 10px;
                color: #333;
                user-select: none;
                z-index: 2;
                transition: color 0.2s;
            }

            .nav-btn:hover {
                color: #888;
            }

            /* --- [확대 모달 스타일] --- */
            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.85);
                z-index: 9999;
                justify-content: center;
                align-items: center;
            }

            .modal-content {
                max-width: 80%;
                max-height: 80vh;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
            }

            .modal-close {
                position: absolute;
                top: 30px;
                right: 40px;
                color: #fff;
                font-size: 40px;
                cursor: pointer;
                user-select: none;
            }

            .modal-btn {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: #fff;
                font-size: 50px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 20px;
                user-select: none;
            }

            .modal-prev { left: 20px; }
            .modal-next { right: 20px; }

            /* [4구역] 하단 CONTACT 영역 */
            .contact-section {
                text-align: center;
                border-top: 1px solid rgba(0, 0, 0, 0.1);
                padding-top: 40px;
                padding-bottom: 40px;
                opacity: 0;
                animation: fadeInUp 1.2s ease-out 0.7s forwards;
            }
            .contact-title-png {
                width: 200px;
                margin: 0 auto 20px auto;
            }
            .twitter-png {
                width: 100%;
                margin-bottom: 15px;
                transition: transform 0.3s ease, filter 0.3s ease;
            }
            .twitter-png:hover {
                transform: scale(1.03);
                filter: brightness(1.2);
            }
            .copyright-png {
                width: 250px;
                margin: 30px auto 0 auto;
            }

            /* --- [모바일 대응 미디어 쿼리 수정] --- */
            @media (max-width: 768px) {
                .profile-section {
                    flex-direction: column;
                    align-items: center;
                }
                .profile-photo {
                    width: 70%;
                }
                .profile-png-group {
                    margin-top: 20px;
                }
                
                /* 모바일에서는 1단(세로) 배치 */
                .char-grid-3col {
                    grid-template-columns: 1fr;
                    gap: 30px;
                }

                .gallery-item {
                    flex: 0 0 calc(50% - 7.5px); /* 모바일에서는 2개씩 표시 */
                }
            }

            /* ANIMATIONS */
            @keyframes floatAnimation {
                0% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
                100% { transform: translateY(0); }
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes slideFromRight {
                from {
                    opacity: 0;
                    transform: translateX(60px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
        </style>
    </head>

    <body>
        <div class="wrapper">
            <!-- [1구역] 상단 배너 -->
            <header class="hero-banner">
                <img src="images/main_banner.png" alt="Hero Background" class="hero-bg" />
                <img src="images/two.png" alt="Sylus & Ophelia Illustration" class="hero-arch-png" />
                <img src="images/title_sylus_ophelia.png" alt="Sylus & Ophelia" class="png-text hero-title-png" />
                <img src="images/love_and_deepspace_under.png" alt="Love & Deepspace" class="png-text hero-footer-png" />
            </header>

            <!-- 본문 영역 -->
            <div class="content-inner">
                
                <!-- [2구역] MAIN 프로필 -->
                <section class="profile-section">
                    <img src="images/profile.png" alt="Ryu E-Hwa" class="profile-photo" />

                    <div class="profile-png-group">
                        <img src="images/main.png" alt="Quote" class="png-text" style="width: 150px" />
                        <img src="images/abmim.png" alt="MAIN" class="png-text" style="width: 500px" />
                    </div>
                </section>

                <!-- [3구역] 캐릭터 상세 -->
                <section class="char-section">
                    <div class="char-grid-3col">
                        <!-- 1열: 기본 프로필 (Profile) -->
                        <div class="col-item">
                            <img src="images/info.png" alt="Profile Info" class="col-png">
                        </div>

                        <!-- 2열: 외모 상세 (Appearance) -->
                        <div class="col-item">
                            <img src="images/face.png" alt="Appearance Info" class="col-png">
                        </div>

                        <!-- 3열: 성격 상세 (Personality) -->
                        <div class="col-item">
                            <img src="images/person.png" alt="Personality Info" class="col-png">
                        </div>
                    </div>
                </section>
                

                <!-- 갤러리 섹션 -->
                <div class="gallery-container">
                    <button class="nav-btn prev-btn" onclick="moveSlide(-1)">&lt;</button>

                    <div class="gallery-track-container">
                        <div class="gallery-track" id="galleryTrack">
                            <div class="gallery-item" onclick="openModal(0)"><img src="images/drink.jpg" alt="이미지 1" /></div>
                            <div class="gallery-item" onclick="openModal(1)"><img src="images/blue_half_tone.jpg" alt="이미지 2" /></div>
                            <div class="gallery-item" onclick="openModal(2)"><img src="images/pantone.jpg" alt="이미지 3" /></div>
                            <div class="gallery-item" onclick="openModal(3)"><img src="images/playlist.jpg" alt="이미지 4" /></div>
                            <div class="gallery-item" onclick="openModal(4)"><img src="images/untitle.jpg" alt="이미지 5" /></div>
                            <div class="gallery-item" onclick="openModal(5)"><img src="images/edit.jpg" alt="이미지 6" /></div>
                            <div class="gallery-item" onclick="openModal(6)"><img src="images/SF.jpg" alt="이미지 6" /></div>
                        </div>
                    </div>

                    <button class="nav-btn next-btn" onclick="moveSlide(1)">&gt;</button>
                </div>

                <!-- [4구역] Contact -->
                <footer class="contact-section">
                    <img src="images/contact.png" alt="Contact" class="png-text contact-title-png" />

                    <a href="https://x.com" target="_blank">
                        <img src="images/twitter.png" alt="Twitter @ABMIM_GAME" class="png-text twitter-png" />
                    </a>

                    <img src="images/footer.png" alt="Copyright" class="png-text copyright-png" />
                </footer>

            </div>
        </div>

        <!-- 이미지 확대 모달 -->
        <div class="modal" id="imageModal" onclick="closeModalOnBg(event)">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <button class="modal-btn modal-prev" onclick="changeModalImg(-1)">&lt;</button>
            <img class="modal-content" id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="확대 이미지" />
            <button class="modal-btn modal-next" onclick="changeModalImg(1)">&gt;</button>
        </div>

        <script>
            let currentSlide = 0;
            let currentModalIndex = 0;

            const track = document.getElementById('galleryTrack');
            const items = document.querySelectorAll('.gallery-item');
            const totalItems = items.length;

            // 모바일 여부 확인 (768px 이하)
            function getItemsPerPage() {
                return window.innerWidth <= 768 ? 2 : 4;
            }

            const imageSources = Array.from(items).map(item => item.querySelector('img').src);

            function moveSlide(direction) {
                const itemsPerPage = getItemsPerPage();
                const maxSlide = Math.max(0, totalItems - itemsPerPage);
                
                currentSlide += direction;

                if (currentSlide < 0) currentSlide = 0;
                if (currentSlide > maxSlide) currentSlide = maxSlide;

                const gap = 15;
                const percentPerItem = 100 / itemsPerPage;
                const gapOffset = (gap * (itemsPerPage - 1)) / itemsPerPage;

                track.style.transform = `translateX(calc(-${currentSlide * percentPerItem}% - ${currentSlide * gapOffset}px))`;
            }

            // 창 크기 변경 시 슬라이더 범위를 넘어가는 버그 방지
            window.addEventListener('resize', () => {
                currentSlide = 0;
                track.style.transform = 'translateX(0px)';
            });

            /* --- 모달 관련 기능 --- */
            function openModal(index) {
                currentModalIndex = index;
                const modal = document.getElementById('imageModal');
                const modalImg = document.getElementById('modalImg');
                
                modalImg.src = imageSources[currentModalIndex];
                modal.style.display = 'flex';
            }

            function closeModal() {
                document.getElementById('imageModal').style.display = 'none';
            }

            function closeModalOnBg(e) {
                if (e.target.id === 'imageModal') {
                    closeModal();
                }
            }

            function changeModalImg(direction) {
                currentModalIndex += direction;
                if (currentModalIndex < 0) currentModalIndex = totalItems - 1;
                if (currentModalIndex >= totalItems) currentModalIndex = 0;

                document.getElementById('modalImg').src = imageSources[currentModalIndex];
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        </script>
    </body>
</html>
